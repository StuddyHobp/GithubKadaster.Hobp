<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0176E3" />
    <title>Uddy vraagt</title>

    <style>
      :root {
        --blauw: #0176e3;
        --lichtblauw: #eaf5ff;
        --lijn: rgba(1, 118, 227, 0.18);
        --wit: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        background: var(--lichtblauw);
        color: var(--blauw);
        font-family: Arial, Helvetica, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      button {
        color: inherit;
        font: inherit;
      }

      .pagina {
        display: grid;
        min-height: 100svh;
        padding:
          max(18px, env(safe-area-inset-top))
          14px
          max(18px, env(safe-area-inset-bottom));
        place-items: center;
      }

      .app {
        position: relative;
        display: flex;
        width: min(100%, 720px);
        height: min(92svh, 780px);
        min-height: 560px;
        overflow: hidden;
        border: 1px solid var(--lijn);
        border-radius: 32px;
        background: var(--wit);
        box-shadow: 0 24px 70px rgba(1, 118, 227, 0.12);
        flex-direction: column;
      }

      .prompt-knop {
        position: relative;
        display: flex;
        min-height: 0;
        padding: 20px 24px 28px;
        border: 0;
        background: transparent;
        cursor: pointer;
        flex: 1;
        flex-direction: column;
        text-align: left;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      .prompt-knop:disabled {
        cursor: default;
      }

      .prompt-knop:focus-visible {
        outline: 4px solid rgba(1, 118, 227, 0.22);
        outline-offset: -7px;
      }

      .vraagvlak {
        position: relative;
        z-index: 2;
        display: flex;
        max-width: 560px;
        margin: auto 0;
        flex-direction: column;
        opacity: 1;
        transform: translateY(0);
        transition:
          opacity 240ms ease,
          transform 240ms ease;
      }

      .vraagvlak.verdwijnt {
        opacity: 0;
        transform: translateY(10px);
      }

      .prompt {
        margin: 0;
        font-size: clamp(34px, 9vw, 66px);
        font-weight: 800;
        letter-spacing: -0.055em;
        line-height: 0.98;
        text-wrap: balance;
      }

      .onderkant {
        position: relative;
        z-index: 2;
        display: flex;
        min-height: 120px;
        padding-top: 18px;
        border-top: 1px solid var(--lijn);
        align-items: flex-end;
        justify-content: space-between;
      }

      .hint {
        display: flex;
        max-width: 145px;
        padding-bottom: 6px;
        font-size: 12px;
        font-weight: 700;
        line-height: 1.35;
        align-items: center;
        gap: 10px;
      }

      .pijl {
        display: grid;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--blauw);
        color: var(--wit);
        font-size: 20px;
        flex: 0 0 auto;
        line-height: 1;
        place-items: center;
        transition: transform 180ms ease;
      }

      .prompt-knop:active .pijl {
        transform: translateX(4px);
      }

      .uddy {
        width: clamp(118px, 35vw, 190px);
        height: clamp(118px, 35vw, 190px);
        margin: 0 -8px -22px 12px;
        object-fit: contain;
        mix-blend-mode: multiply;
        user-select: none;
        -webkit-user-drag: none;
      }

      .decoratie {
        position: absolute;
        right: -120px;
        bottom: 80px;
        width: 300px;
        height: 300px;
        border: 1px solid var(--lijn);
        border-radius: 50%;
        pointer-events: none;
      }

      .decoratie::after {
        position: absolute;
        inset: 35px;
        border: 1px solid var(--lijn);
        border-radius: inherit;
        content: "";
      }

      @media (min-width: 650px) {
        .app {
          border-radius: 42px;
        }

        .prompt-knop {
          padding: 32px 38px 38px;
        }

        .vraagvlak {
          margin-left: 20px;
        }

        .onderkant {
          min-height: 160px;
          padding-left: 20px;
        }
      }

      @media (max-height: 650px) {
        .app {
          height: calc(100svh - 24px);
          min-height: 0;
        }

        .prompt {
          font-size: clamp(28px, 7vw, 50px);
        }

        .onderkant {
          min-height: 100px;
        }

        .uddy {
          width: 105px;
          height: 105px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .vraagvlak,
        .pijl {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <main class="pagina">
      <section class="app" aria-label="Uddy prompt-app">
        <button
          class="prompt-knop"
          id="promptKnop"
          type="button"
          aria-label="Toon de volgende vraag"
        >
          <span class="vraagvlak" id="vraagvlak">
            <span class="prompt" id="prompt"></span>
          </span>

          <span class="onderkant">
            <span class="hint">
              <span class="pijl" aria-hidden="true">→</span>
              Tik voor de volgende vraag
            </span>
            <img class="uddy" id="uddy" src="" alt="" />
          </span>

          <span class="decoratie" aria-hidden="true"></span>
        </button>
      </section>
    </main>

    <script>
      /*
       * PAS HIER JULLIE PROMPTS AAN.
       * Zet iedere prompt tussen aanhalingstekens en plaats er een komma achter.
       */
      const prompts = [
        "Part 2 Vraag 1",
        "Vraag 2",
        "Vraag 3",
        "Vraag 4",
        "Vraag 5",
        "Vraag 6",
      ];

      /*
       * De afbeeldingen blijven in de aparte map 'images'.
       */
      const afbeeldingen = [
        { bestand: "images/uddy-zwaait.png", alt: "Uddy zwaait" },
        { bestand: "images/uddy-wijst.png", alt: "Uddy wijst iets aan" },
        { bestand: "images/uddy-neutraal.png", alt: "Uddy kijkt vriendelijk" },
        { bestand: "images/uddy-loopt.png", alt: "Uddy loopt" },
        { bestand: "images/uddy-denkt.png", alt: "Uddy denkt na" },
      ];

      const promptKnop = document.querySelector("#promptKnop");
      const vraagvlak = document.querySelector("#vraagvlak");
      const promptElement = document.querySelector("#prompt");
      const afbeeldingElement = document.querySelector("#uddy");

      let promptNummer = -1;
      let afbeeldingNummer = 0;
      let wisselt = false;
      const hintElement = document.querySelector(".hint");

      function kiesAnderNummer(huidig, aantal) {
        if (aantal <= 1) return 0;

        let nieuw = huidig;
        while (nieuw === huidig) {
          nieuw = Math.floor(Math.random() * aantal);
        }
        return nieuw;
      }

      function kiesVolgendePrompt() {
        promptNummer += 1;
      }

      function toonEinde() {
        promptElement.textContent = "Je hebt alle vragen gehad!";
        hintElement.textContent = "Bedankt voor het meedoen!";
        promptKnop.setAttribute("aria-label", "Je hebt alle vragen gehad!");
        promptKnop.disabled = true;
      }
      function vulKaart() {
        promptElement.textContent = prompts[promptNummer];
        afbeeldingElement.src = afbeeldingen[afbeeldingNummer].bestand;
        afbeeldingElement.alt = afbeeldingen[afbeeldingNummer].alt;
      }

      function volgendePrompt() {
        if (wisselt || promptKnop.disabled || prompts.length === 0) return;

        wisselt = true;
        vraagvlak.classList.add("verdwijnt");

        window.setTimeout(() => {
          if (promptNummer === prompts.length - 1) {
            toonEinde();
            vraagvlak.classList.remove("verdwijnt");
            wisselt = false;
            return;
          }

          kiesVolgendePrompt();
          afbeeldingNummer = kiesAnderNummer(
            afbeeldingNummer,
            afbeeldingen.length,
          );
          vulKaart();
          vraagvlak.classList.remove("verdwijnt");
          wisselt = false;
        }, 240);
      }

      if (prompts.length === 0) {
        promptElement.textContent = "Voeg eerst een prompt toe in de code.";
        afbeeldingElement.hidden = true;
        hintElement.textContent = "Er zijn nog geen vragen beschikbaar.";
        promptKnop.disabled = true;
      } else {
        kiesVolgendePrompt();
        vulKaart();
        promptKnop.addEventListener("click", volgendePrompt);
      }
    </script>
  </body>
</html>
